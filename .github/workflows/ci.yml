name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      - run: uv run pytest

  web:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  examples:
    name: Examples (build and run marks.c)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh examples/marks/test.sh

  compose:
    name: docker compose up (end to end)
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --detach --wait
      - name: Web page reports the API as up
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000 | grep -q "API is up"; then exit 0; fi
            sleep 2
          done
          curl -sS http://localhost:3000 || true
          exit 1
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down
