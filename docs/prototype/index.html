<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>Yanix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: workbench. A lit board on a dark desk, inspector to the right, playback rail below. Single dark look by choice. */
:root{
  --desk:#0a0c0f; --panel:#12161b; --panel2:#181d24; --ink:#e7ebef; --muted:#8c97a4; --line:#262d36;
  --user:#ff7ab6; --kernel:#8fa3ff; --hw:#ffb35c; --sig:#3fe0ff; --silk:#dfe7e1;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Share Tech Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--desk);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
*{box-sizing:border-box}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sig);outline-offset:2px}

.app{height:100%;display:grid;gap:12px;padding-block:12px;padding-inline:16px;
  grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"top top" "canvas inspector" "play play"}

.top{grid-area:top;display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px}
.brand{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.04em;line-height:1;display:flex;align-items:baseline;gap:10px}
.brand b{color:var(--sig)}
.brand small{font-family:var(--f-mono);font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-family:var(--f-display);font-size:17px;font-weight:600;min-width:0}
.crumbs button{background:none;border:0;padding:2px 6px;border-radius:4px;color:var(--muted);cursor:pointer}
.crumbs button:hover{color:var(--ink);background:var(--panel2)}
.crumbs .sep{color:#3a434f}
.crumbs [aria-current]{padding:2px 6px}
.legend{margin-left:auto;display:flex;flex-wrap:wrap;gap:14px;font-family:var(--f-mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;border:2px solid}
.legend i.lg-user{border-color:var(--user)}.legend i.lg-kernel{border-color:var(--kernel)}.legend i.lg-hw{border-color:var(--hw)}.legend i.lg-sig{border-color:var(--sig);background:var(--sig)}

.canvas{grid-area:canvas;position:relative;min-height:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 40%,#151a20 0%,#0b0e12 70%,#07090b 100%)}
.canvas svg{display:block;width:100%;height:100%}
.canvas .hint{position:absolute;left:14px;bottom:10px;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);pointer-events:none}
#scene{transform-box:view-box;transition:transform .28s ease,opacity .28s ease}
#scene.leave-in{opacity:0;transform:scale(1.6)}
#scene.leave-out{opacity:0;transform:scale(.7)}
#scene.enter-in{opacity:0;transform:scale(.7);transition:none}
#scene.enter-out{opacity:0;transform:scale(1.6);transition:none}

/* svg art text */
.silk{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;fill:var(--silk);opacity:.82}
.silk.sm{font-size:10px}
.silk.lg{font-size:18px;letter-spacing:.14em}
.die-label{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;fill:#e9ecf5;opacity:.9}
.die-label.dim{opacity:.45}
.engrave{font-family:var(--f-display);font-weight:700;fill:#5b626b}
.engrave.sm{font-family:var(--f-mono);font-weight:400;fill:#6b727b}
.term-title{font-family:var(--f-mono);font-size:11px;fill:#9aa4b1}
.term-line{font-family:var(--f-mono);font-size:12.5px;fill:#cfe8d4}
.card-name{font-family:var(--f-display);font-weight:600;font-size:19px;fill:var(--ink)}
.card-sub{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
.band-label{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em}

/* signal paths */
.link .wire{fill:none;stroke:rgba(255,255,255,.0);stroke-width:2}
.link .lbl{font-family:var(--f-mono);font-size:12.5px;fill:var(--sig);opacity:0;paint-order:stroke;stroke:#05080b;stroke-width:5px;stroke-linejoin:round}
.link.flow .wire{stroke:var(--sig);stroke-width:4;stroke-dasharray:12 8;animation:dash .5s linear infinite;filter:url(#glow)}
.link.flow.rev .wire{animation-direction:reverse}
.link.flow .lbl{opacity:1}
.link .dot{fill:#fff;filter:url(#glow)}
@keyframes dash{to{stroke-dashoffset:-20}}

/* hotspots */
.hot{cursor:pointer}
.hot .hit{fill:transparent}
.hot .ring{fill:none;stroke:transparent;stroke-width:2}
.hot:hover .ring{stroke:rgba(255,255,255,.35)}
.hot:focus{outline:none}
.hot:focus-visible .ring{stroke:var(--sig)}
.hot.selected .ring{stroke:#fff;stroke-dasharray:7 5;stroke-width:2}
.hot.target .ring{stroke:var(--sig);stroke-dasharray:6 6;stroke-width:2.5}
.hot.active .ring{stroke:var(--sig);stroke-width:3.5;filter:url(#glow);animation:breathe 1.1s ease-in-out infinite}
.hot.active .hit{fill:rgba(63,224,255,.10)}
@keyframes breathe{50%{stroke-opacity:.45}}
.hot .tip{opacity:0;transition:opacity .15s;pointer-events:none}
.hot:hover .tip,.hot.selected .tip,.hot.active .tip,.hot.target .tip,.hot:focus-visible .tip{opacity:1}
.tip rect{fill:#05080b;stroke:#3a4450}
.tip text{font-family:var(--f-display);font-weight:600;font-size:15px;fill:var(--ink)}
.pill rect{fill:#05080b;stroke:var(--sig)}
.pill text{font-family:var(--f-mono);font-size:11.5px;fill:var(--sig)}
.pill:hover rect{fill:#0c2a33}

/* inspector */
.inspector{grid-area:inspector;min-height:0;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 18px 20px;display:flex;flex-direction:column;gap:14px}
.chip{display:inline-flex;align-items:center;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:2px 9px;border-radius:999px;border:1.5px solid}
.chip.user{color:var(--user);border-color:var(--user)}.chip.kernel{color:var(--kernel);border-color:var(--kernel)}.chip.hw{color:var(--hw);border-color:var(--hw)}
.inspector h2{margin:0;font-family:var(--f-display);font-size:30px;line-height:1.05;font-weight:700;text-wrap:balance}
.inspector h3{margin:0 0 4px;font-family:var(--f-mono);font-size:11.5px;font-weight:400;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.inspector p{margin:0}
.inspector dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-variant-numeric:tabular-nums}
.inspector dt{color:var(--muted)}
.inspector dd{margin:0;font-family:var(--f-mono)}
.flag{font-size:12.5px;color:var(--muted);border-left:2px solid var(--hw);padding-left:8px}
.src{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.src li{font-family:var(--f-mono);font-size:12.5px;overflow-wrap:anywhere}
.src span{color:var(--muted)}
.src a{color:var(--sig)}
.primary{align-self:flex-start;background:var(--sig);color:#03141a;border:0;border-radius:6px;padding:7px 14px;font-weight:600;cursor:pointer}

/* playback */
.play{grid-area:play;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;display:grid;gap:10px;
  grid-template-columns:auto auto minmax(0,1fr) auto;align-items:center;grid-template-areas:"scen ctrl note lat" "steps steps steps steps"}
.lbl-sm{display:block;font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.scen{grid-area:scen}
.scen select{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;max-width:100%}
.ctrl{grid-area:ctrl;display:flex;gap:4px}
.ctrl button{width:36px;height:34px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-size:13px}
.ctrl button.main{background:var(--sig);border-color:var(--sig);color:#03141a;width:46px;font-weight:700}
.note{grid-area:note;min-width:0}
.note .text{font-weight:500;font-size:15px}
.lat{grid-area:lat;text-align:right;font-variant-numeric:tabular-nums}
.lat .big{font-family:var(--f-display);font-size:28px;font-weight:700;line-height:1;color:var(--sig)}
.lat .sub{font-size:12px;color:var(--muted)}
.steps{grid-area:steps;display:flex;flex-wrap:wrap;gap:4px}
.steps button{flex:1 0 22px;min-width:22px;height:12px;border-radius:3px;border:0;cursor:pointer;opacity:.3;padding:0}
.steps .user{background:var(--user)}.steps .kernel{background:var(--kernel)}.steps .hw{background:var(--hw)}
.steps .done{opacity:.7}.steps .on{opacity:1;outline:2px solid var(--sig);outline-offset:1px}

@media (max-width:900px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto;grid-template-areas:"top" "canvas" "play" "inspector"}
  .canvas{overflow-x:auto}
  .canvas svg{width:820px;height:auto;aspect-ratio:1200/780}
  .canvas .hint{display:none}
  .legend{margin-left:0}
  .play{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"scen scen" "ctrl lat" "note note" "steps steps"}
}
@media (prefers-reduced-motion: reduce){
  #scene{transition:none}
  .link.flow .wire,.hot.active .ring{animation:none}
  .link .dot{display:none}
}
</style>

<div class="app">
  <header class="top">
    <div class="brand"><span>yan<b>i</b>x</span><small>prototype</small></div>
    <nav class="crumbs" id="crumbs" aria-label="Zoom level"></nav>
    <div class="legend" aria-label="Legend">
      <span><i class="lg-user"></i>User space</span>
      <span><i class="lg-kernel"></i>Kernel</span>
      <span><i class="lg-hw"></i>Hardware</span>
      <span><i class="lg-sig"></i>Signal</span>
    </div>
  </header>

  <main class="canvas" aria-label="Machine view">
    <svg viewBox="0 0 1200 780" preserveAspectRatio="xMidYMid meet" role="group" aria-labelledby="levelTitle">
      <title id="levelTitle">System</title>
      <defs>
        <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1200" height="780"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".55"/></filter>
        <linearGradient id="pcb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#143a30"/><stop offset=".6" stop-color="#0f2c25"/><stop offset="1" stop-color="#0b221c"/></linearGradient>
        <pattern id="pcbtex" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M0 12 H22 L34 24 H60 M14 0 V8 M44 60 V46 L54 36 M0 44 H10 L18 52 V60 M30 0 V6 L38 14" fill="none" stroke="#1d4a3d" stroke-width="1.3"/><circle cx="34" cy="24" r="1.8" fill="#2a5e4e"/><circle cx="18" cy="52" r="1.8" fill="#2a5e4e"/></pattern>
        <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eceef1"/><stop offset=".45" stop-color="#b1b8c0"/><stop offset=".7" stop-color="#dadee2"/><stop offset="1" stop-color="#9aa1aa"/></linearGradient>
        <linearGradient id="die" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b2030"/><stop offset=".5" stop-color="#232840"/><stop offset="1" stop-color="#2a2340"/></linearGradient>
        <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7fd8ff" stop-opacity="0"/><stop offset=".5" stop-color="#b48cff" stop-opacity=".08"/><stop offset="1" stop-color="#7fffd0" stop-opacity="0"/></linearGradient>
        <pattern id="sram" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#2b2846"/><path d="M0 .5 H6 M.5 0 V6" stroke="#463f70" stroke-width="1"/></pattern>
        <pattern id="sram2" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="#25304a"/><path d="M0 .5 H5 M.5 0 V5" stroke="#3b4d78" stroke-width="1"/></pattern>
        <pattern id="fins" width="9" height="9" patternUnits="userSpaceOnUse"><rect width="9" height="9" fill="#343a43"/><rect width="5" height="9" fill="#5d6570"/></pattern>
        <pattern id="finsH" width="9" height="9" patternUnits="userSpaceOnUse"><rect width="9" height="9" fill="#2f353d"/><rect width="9" height="5" fill="#535b66"/></pattern>
        <pattern id="pins" width="11" height="11" patternUnits="userSpaceOnUse"><rect width="11" height="11" fill="#e9e9e6"/><rect x="2.5" y="2.5" width="6" height="6" rx="1" fill="#7d8389"/></pattern>
        <pattern id="phy" width="7" height="10" patternUnits="userSpaceOnUse"><rect width="7" height="10" fill="#3a3220"/><rect width="3.5" height="10" fill="#b38f3e"/></pattern>
        <pattern id="gold" width="5" height="10" patternUnits="userSpaceOnUse"><rect width="5" height="10" fill="#0f3d2b"/><rect width="3" height="10" fill="#d4ac4a"/></pattern>
        <pattern id="goldV" width="10" height="5" patternUnits="userSpaceOnUse"><rect width="10" height="5" fill="#0f3d2b"/><rect width="10" height="3" fill="#d4ac4a"/></pattern>
      </defs>
      <g id="scene"></g>
    </svg>
    <div class="hint">Click a part to inspect · “open” or double-click to zoom in · Esc zooms out</div>
  </main>

  <aside class="inspector" id="inspector" aria-live="polite"></aside>

  <section class="play" aria-label="Scenario playback">
    <div class="scen">
      <label for="scenario" class="lbl-sm">Scenario</label>
      <select id="scenario">
        <option value="read">read() 4 KB from a file</option>
        <option value="load">Load a value from RAM</option>
        <option disabled>Cache playground (phase 5)</option>
      </select>
    </div>
    <div class="ctrl">
      <button type="button" id="reset" aria-label="Reset">⏮</button>
      <button type="button" id="back" aria-label="Step back">◀</button>
      <button type="button" id="playBtn" class="main" aria-label="Play">▶</button>
      <button type="button" id="fwd" aria-label="Step forward">▶|</button>
    </div>
    <div class="note" aria-live="polite">
      <div class="lbl-sm" id="stepno"></div>
      <div class="text" id="steptext"></div>
    </div>
    <div class="lat">
      <div class="big" id="latBig">0 ns</div>
      <div class="sub" id="latSub"></div>
    </div>
    <div class="steps" id="steps"></div>
  </section>
</div>

<script>
const PLACEHOLDER = 'Placeholder from the draft plan. Needs a source before it ships (NFR9).';
const NOFIG = 'Typical size and latency: no sourced figure yet (NFR9).';

// Component catalog. In the real app this comes from content/*.yaml via GET /api/v1/components.
const C = {
  'user.process': {name:'User process', layer:'user', kind:'process',
    summary:'A program running in user space. It cannot touch hardware or kernel memory directly, so it asks the kernel through system calls.',
    why:'Isolation. A bug in one program cannot corrupt the kernel or other programs.'},
  'kernel': {name:'Linux kernel', layer:'kernel', kind:'operating system',
    summary:'The privileged program that manages CPUs, memory, files and devices for every process. Its code runs on the CPU and lives in RAM.',
    why:'Many programs share one machine. Something has to arbitrate access and hide device details behind common interfaces like files.'},
  'cpu': {name:'CPU', layer:'hw', kind:'processor',
    summary:'The processor in its socket. Under the metal heat spreader sits a silicon die with several cores, a shared cache, a memory controller and PCIe.',
    why:'Cores do the computing. Everything else in the package exists to feed them data fast enough.'},
  'ram': {name:'RAM (DIMMs)', layer:'hw', kind:'memory',
    summary:'Main memory: DRAM chips on removable sticks (DIMMs), one stick per channel here. Holds running programs, their data and the kernel’s page cache. Contents are lost on power off.',
    why:'Far larger than the CPU caches and far faster than storage. It sits in the middle of the hierarchy.'},
  'chipset': {name:'Chipset (PCH)', layer:'hw', kind:'interconnect',
    summary:'The platform controller hub. It hangs off the CPU and provides extra lanes and ports: SATA, USB, more PCIe, the network controller.',
    why:'The CPU has a limited number of lanes. The chipset fans them out to slower devices.'},
  'ssd': {name:'NVMe SSD', layer:'hw', kind:'storage',
    summary:'An M.2 stick with a controller, a little DRAM and NAND flash chips. It talks to the CPU over PCIe and moves data into RAM itself using DMA.',
    why:'Data must survive power off. Flash is cheap per byte but much slower than RAM.'},
  'nic': {name:'Network controller', layer:'hw', kind:'network',
    summary:'The LAN chip behind the Ethernet port. The receive path is planned for after v0.1.',
    why:'Connects the machine to other machines.'},

  'kernel.syscall': {name:'Syscall entry', layer:'kernel', kind:'entry point',
    summary:'The door from user space. The syscall instruction switches the CPU to kernel mode and jumps to the kernel’s entry code, which dispatches on the syscall number.',
    why:'User code must not run with kernel privileges, so every request goes through one controlled entry point.',
    source:[['arch/x86/entry/entry_64.S','entry_SYSCALL_64','x86-64 entry code'],['fs/read_write.c','ksys_read','read() lands here']]},
  'kernel.vfs': {name:'VFS', layer:'kernel', kind:'subsystem',
    summary:'The Virtual File System. One interface (open, read, write) over every filesystem the kernel supports.',
    why:'Programs should not care whether a file lives on ext4, XFS or a network share.',
    source:[['fs/read_write.c','vfs_read','generic read path']]},
  'kernel.pagecache': {name:'Page cache', layer:'kernel', kind:'cache',
    summary:'File contents the kernel keeps in RAM, so repeated reads do not go to the disk.',
    why:'An SSD read is far slower than a RAM access. Keeping recently used file pages in otherwise free RAM hides that gap.',
    source:[['mm/filemap.c','filemap_read','buffered read through the cache']]},
  'kernel.fs': {name:'Filesystem (ext4)', layer:'kernel', kind:'filesystem',
    summary:'Translates a position inside a file into block numbers on the disk, and keeps the on-disk structures consistent.',
    why:'A disk is a flat array of blocks. Files, names and directories are an illusion the filesystem maintains.',
    source:[['fs/ext4/inode.c','ext4_map_blocks','file offset to disk block']]},
  'kernel.block': {name:'Block layer', layer:'kernel', kind:'subsystem',
    summary:'Takes I/O requests (bios) from filesystems, queues and merges them, and hands them to storage drivers through blk-mq.',
    why:'Filesystems should not need to know which storage device or driver is underneath.',
    source:[['block/blk-core.c','submit_bio','entry point for I/O']]},
  'kernel.nvme': {name:'NVMe driver', layer:'kernel', kind:'driver',
    summary:'Turns block requests into NVMe commands, writes them into submission queues in RAM and rings the device’s doorbell register.',
    why:'Each device speaks its own protocol. The driver is the translator.',
    source:[['drivers/nvme/host/pci.c','nvme_queue_rq','submit a command']]},
  'kernel.irq': {name:'Interrupt handling', layer:'kernel', kind:'subsystem',
    summary:'Runs when a device raises an interrupt. The NVMe handler reads the completion queue and completes the finished requests.',
    why:'Without interrupts the CPU would have to keep polling the device to learn that the I/O finished.',
    source:[['drivers/nvme/host/pci.c','nvme_irq','NVMe interrupt handler'],['kernel/irq/','','generic IRQ core']]},
  'kernel.sched': {name:'Scheduler', layer:'kernel', kind:'subsystem',
    summary:'Decides which task runs on each CPU. A task waiting for I/O sleeps; waking it makes it runnable again.',
    why:'The CPU should do useful work while a process waits on the disk.',
    source:[['kernel/sched/core.c','schedule','pick the next task'],['kernel/sched/core.c','try_to_wake_up','wake a sleeping task']]},

  'cpu.core': {name:'Core 0', layer:'hw', kind:'core',
    summary:'One core: fetches and executes an instruction stream with its own registers, execution units, L1 caches and L2.',
    why:'Several cores let the machine run several tasks truly in parallel.'},
  'cpu.core1': {name:'Cores 1 to 3', layer:'hw', kind:'cores',
    summary:'The other cores. Each has the same private parts as core 0. Keeping their caches coherent (MESI) is planned for later.',
    why:'Shown to make the point that L3 is shared and L1 and L2 are not.'},
  'cpu.l3': {name:'Shared L3 cache', layer:'hw', kind:'cache',
    summary:'Last-level cache, split into slices next to each core and joined by the ring bus, shared by all cores.',
    why:'Catches misses from every core’s private caches before they have to go out to RAM.'},
  'cpu.imc': {name:'Memory controller', layer:'hw', kind:'controller',
    summary:'Turns cache-line requests into DRAM commands. The striped strip on the die edge is its physical interface (PHY) to the DIMMs.',
    why:'DRAM needs precise command timing; the controller hides it from the caches.'},
  'cpu.io': {name:'PCIe controller', layer:'hw', kind:'interconnect',
    summary:'PCIe root ports on the die. Device DMA traffic and interrupt messages from the SSD arrive here.',
    why:'Fast devices connect close to the cores and the memory controller.'},
  'cpu.apic': {name:'Interrupt controller', layer:'hw', kind:'APIC',
    summary:'Delivers interrupts to cores. On x86, device MSI-X messages are memory writes that target a core’s local APIC.',
    why:'Many devices need a way to get a core’s attention without the core asking.'},

  'cpu.core.regs': {name:'Register file', layer:'hw', kind:'storage',
    summary:'A small set of named registers that instructions operate on directly. The fastest storage in the machine.',
    why:'Arithmetic needs operands right next to the execution units.'},
  'cpu.core.alu': {name:'ALUs', layer:'hw', kind:'execution',
    summary:'Integer arithmetic and logic units. They take values from registers and write results back.',
    why:'This is where the actual computing happens.'},
  'cpu.core.lsu': {name:'Load/store unit', layer:'hw', kind:'execution',
    summary:'Executes loads and stores: computes the address, asks the TLB to translate it and talks to the L1 data cache.',
    why:'Memory access has its own pipeline so it can overlap with arithmetic.'},
  'cpu.core.tlb': {name:'TLB', layer:'hw', kind:'cache',
    summary:'Caches recent virtual-to-physical address translations, so most memory accesses skip the page table walk.',
    why:'Every load needs a translation. Walking the page tables each time would multiply memory traffic.'},
  'cpu.core.l1i': {name:'L1i cache', layer:'hw', kind:'cache',
    summary:'Holds the instructions the core is about to execute.',
    why:'Instruction fetch must keep up with execution.'},
  'cpu.core.l1d': {name:'L1d cache', layer:'hw', kind:'cache',

const NS = 'http://www.w3.org/2000/svg';
const $ = s => document.querySelector(s);
function el(tag, attrs, parent){
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
const R = (g,x,y,w,h,a={}) => el('rect', {x,y,width:w,height:h,...a}, g);
const T = (g,x,y,txt,cls,a={}) => { const t = el('text', {x,y,class:cls,...a}, g); t.textContent = txt; return t; };

function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// Die textures: random standard-cell logic vs regular SRAM arrays.
function logic(g,x,y,w,h,seed,base='#232a3a'){
  R(g,x,y,w,h,{fill:base,stroke:'#3a4256','stroke-width':1});
  const r = rng(seed), pal = ['#2f3850','#283046','#37415d','#2a2f45','#3a3556'];
  const n = Math.round(w*h/700);
  for (let i = 0; i < n; i++){
    const rw = 6 + r()*38, rh = 4 + r()*22;
    R(g, x+3+r()*(w-6-rw), y+3+r()*(h-6-rh), rw, rh, {fill:pal[(r()*pal.length)|0], opacity:.85});
  }
  for (let i = 0; i < n/3; i++){
    const yy = y+4+r()*(h-8);
    R(g, x+3, yy, w-6, .8, {fill:'#4a5370', opacity:.35});
  }
}
function sram(g,x,y,w,h,fill='url(#sram)',banks=4){
  R(g,x,y,w,h,{fill,stroke:'#4b4675','stroke-width':1});
  for (let i = 1; i < banks; i++) R(g, x + i*w/banks - 1, y, 2, h, {fill:'#1a1830', opacity:.9});
  R(g, x, y+h/2-1, w, 2, {fill:'#1a1830', opacity:.9});
}
function chip(g,x,y,w,h,label,cls='silk sm'){
  R(g,x,y,w,h,{fill:'#16181c',stroke:'#2b2f35',rx:2});
  R(g,x+3,y+3,w-6,h-6,{fill:'none',stroke:'#24282e'});
  if (label) T(g,x+w/2,y+h/2+4,label,cls,{'text-anchor':'middle'});
}
function terminal(g,x,y,w,h,title,lines,color){
  R(g,x,y,w,h,{rx:8,fill:'#0b0f14',stroke:color,'stroke-width':1.6,filter:'url(#shadow)'});

}
function dimm(g,x,y,w,h,vertical=true){
  R(g,x,y,w,h,{rx:2,fill:'#0f3d2b',stroke:'#1f6045'});
  if (vertical){
    for (let i = 0; i < 8; i++) chip(g, x+4, y+8+i*(h-16)/8, w-8, (h-16)/8-6);

  terminal(g,480,72,240,70,'user process',['read(3, buf, 4096)'],'var(--user)');
  c.hot('user.process',480,72,240,70,{rx:8,ghost:true});

  const card = (id,x,y,sub) => {
    R(g,x,y,240,60,{rx:8,fill:'#121925',stroke:'var(--kernel)','stroke-width':1.5});
    T(g,x+14,y+26,C[id].name,'card-name'); T(g,x+14,y+45,sub,'card-sub');
    c.hot(id,x,y,240,60,{rx:8});
  };
  card('kernel.syscall',480,182,'entry_SYSCALL_64');
  card('kernel.vfs',480,272,'fs/read_write.c');
  card('kernel.pagecache',480,362,'mm/filemap.c');
  card('kernel.fs',140,362,'fs/ext4/');
  card('kernel.block',140,452,'block/');
  card('kernel.nvme',140,542,'drivers/nvme/host/');
  card('kernel.sched',820,452,'kernel/sched/');
  card('kernel.irq',820,542,'kernel/irq/');

  m2(g,150,668,220,56);
  T(g,150,744,'NVMe SSD','silk sm');
  c.hot('ssd',140,660,240,92,{ghost:true});
  chip(g,870,662,140,64,'APIC');
  T(g,830,744,'interrupt controller','silk sm');
  c.hot('cpu.apic',820,656,240,96,{ghost:true});

  c.link('user.process','kernel.syscall','M600 142 V182','read()',608,166,'start');
  c.link('kernel.syscall','kernel.vfs','M600 242 V272','dispatch',608,262,'start');
  c.link('kernel.vfs','kernel.pagecache','M600 332 V362','lookup',608,352,'start');
  c.link('kernel.pagecache','kernel.fs','M480 392 H380','miss',430,384,'middle');
  c.link('kernel.fs','kernel.block','M260 422 V452','bio',268,442,'start');
  c.link('kernel.block','kernel.nvme','M260 512 V542','request',268,532,'start');
  c.link('kernel.nvme','ssd','M260 602 V668','doorbell',268,640,'start');
  c.link('kernel.pagecache','kernel.sched','M600 422 V482 H820','sleep on I/O',700,474,'middle');
  c.link('cpu.apic','kernel.irq','M940 662 V602','interrupt',948,640,'start');
  c.link('kernel.irq','kernel.sched','M940 542 V512','wake',948,532,'start');
  c.link('kernel.pagecache','user.process','M720 380 H780 V106 H720','copy_to_user',788,250,'start');
}

const VIEWS = {
  system:{title:'System', parent:null, draw:drawSystem},
  kernel:{title:'Linux kernel', parent:'system', draw:drawKernel},
  cpu:{title:'CPU', parent:'system', draw:drawCpu},
  'cpu.core':{title:'Core 0', parent:'cpu', draw:drawCore},
};
function depth(lv){ let d = 0; while (VIEWS[lv].parent){ lv = VIEWS[lv].parent; d++; } return d; }

/* ---------- rendering ---------- */
const scene = $('#scene');
const reduced = matchMedia('(prefers-reduced-motion: reduce)');
const st = {level:'system', selected:'cpu', scen:'read', idx:-1, playing:false, timer:null, boxes:{}};

function draw(lv){
  scene.replaceChildren();
  $('#levelTitle').textContent = VIEWS[lv].title + ' level';
  const art = el('g', {}, scene), links = el('g', {}, scene), hots = el('g', {}, scene);
  st.boxes = {};
  const ctx = {
    art,
    hot(id,x,y,w,h,opt){
      const c = C[id], ghost = !!opt.ghost, rx = opt.rx ?? 6;
      (st.boxes[id] ||= []).push({x,y,w,h});
      const g = el('g', {class:'hot'+(ghost?' ghost':''), 'data-id':id, tabindex:0, role:'button',
        'aria-label': ghost ? `${c.name}, shown from the ${VIEWS[homeOf(id)].title} level. Press Enter to go there.` : `${c.name}${OPENS[id]?', can be opened':''}`}, hots);
      el('title', {}, g).textContent = c.name;
      el('rect', {class:'ring', x:x-5, y:y-5, width:w+10, height:h+10, rx:rx+4}, g);
      el('rect', {class:'hit', x, y, width:w, height:h, rx}, g);
      const label = ghost ? `${c.name} ↗ ${VIEWS[homeOf(id)].title}` : c.name;
      const tw = label.length*7.4 + 20, ty = y - 34 < 4 ? y + h + 6 : y - 34;
      const tip = el('g', {class:'tip', transform:`translate(${Math.min(x, 1196-tw)} ${ty})`}, g);
      el('rect', {width:tw, height:26, rx:5}, tip);
      T(tip, 10, 18, label, '');
      if (OPENS[id] && !ghost){
        const pill = el('g', {class:'pill', transform:`translate(${x+w-70} ${y+8})`}, g);
        el('rect', {width:62, height:22, rx:11}, pill);
        T(pill, 31, 15, 'open ›', '', {'text-anchor':'middle'});
        pill.addEventListener('click', ev => { ev.stopPropagation(); navigate(OPENS[id], {origin:{x,y,w,h}}); });
        g.addEventListener('dblclick', () => navigate(OPENS[id], {origin:{x,y,w,h}}));
      }
      const act = () => ghost ? navigate(homeOf(id), {select:id}) : select(id);
      g.addEventListener('click', act);
      g.addEventListener('keydown', ev => {
        if (ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); act(); }
        if (ev.key === 'o' && OPENS[id] && !ghost){ ev.preventDefault(); navigate(OPENS[id], {origin:{x,y,w,h}}); }
      });
    },
    link(from,to,d,label,lx,ly,anchor='middle'){
      const g = el('g', {class:'link', 'data-key':`${from}>${to}`, 'data-d':d}, links);
      el('path', {class:'wire', d}, g);
      T(g, lx, ly, label, 'lbl', {'text-anchor':anchor});
    },
  };
  VIEWS[lv].draw(ctx);
  applySelection(); applyTrace(); drawCrumbs();
}

function navigate(lv, opts = {}){
  if (opts.select) st.selected = opts.select;
  if (lv === st.level){ applySelection(); renderInspector(); return; }
  const dir = depth(lv) >= depth(st.level) ? 'in' : 'out';
  const o = opts.origin;
  scene.style.transformOrigin = o ? `${o.x+o.w/2}px ${o.y+o.h/2}px` : '600px 390px';
  st.level = lv;
  try { history.replaceState(null, '', '#' + lv); } catch(e){}
  if (reduced.matches){ draw(lv); renderInspector(); return; }
  scene.classList.add('leave-'+dir);
  setTimeout(() => {
    scene.classList.remove('leave-'+dir);
    scene.style.transformOrigin = '600px 390px';
    scene.classList.add('enter-'+dir);
    draw(lv); renderInspector();
    scene.getBoundingClientRect();
    requestAnimationFrame(() => scene.classList.remove('enter-'+dir));
  }, 280);
}

function drawCrumbs(){
  const nav = $('#crumbs'); nav.replaceChildren();
  const path = []; let lv = st.level;
  while (lv){ path.unshift(lv); lv = VIEWS[lv].parent; }
  path.forEach((p, i) => {
    if (i){ const s = document.createElement('span'); s.className = 'sep'; s.textContent = '/'; s.setAttribute('aria-hidden','true'); nav.append(s); }
    if (i === path.length-1){
      const s = document.createElement('span'); s.textContent = VIEWS[p].title; s.setAttribute('aria-current','page'); nav.append(s);
    } else {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = VIEWS[p].title;
      b.onclick = () => navigate(p); nav.append(b);
    }
  });
}

function select(id){ st.selected = id; applySelection(); renderInspector(); }
function applySelection(){
  scene.querySelectorAll('.hot.selected').forEach(n => n.classList.remove('selected'));
  scene.querySelectorAll(`.hot[data-id="${st.selected}"]:not(.ghost)`).forEach(n => n.classList.add('selected'));
}

function renderInspector(){
  const id = st.selected, c = C[id], box = $('#inspector');
  const esc = s => String(s).replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
  let h = `<div><span class="chip ${c.layer}">${LAYER_NAME[c.layer]} · ${esc(c.kind)}</span></div>
    <h2>${esc(c.name)}</h2><p>${esc(c.summary)}</p>
    <div><h3>Why it exists</h3><p>${esc(c.why)}</p></div>`;
  if (c.specs){
    h += `<div><h3>Typical figures</h3><dl>${c.specs.map(([k,v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl></div>`;
    if (c.specsNote) h += `<p class="flag">${esc(c.specsNote)}</p>`;
  } else if (c.layer === 'hw'){
    h += `<p class="flag">${NOFIG}</p>`;
  }
  if (c.source){
    h += `<div><h3>In the kernel source</h3><ul class="src">${c.source.map(([f,sym,what]) =>
      `<li>${sym?`${esc(sym)}() `:''}${esc(f)}<br><span>${esc(what)}</span></li>`).join('')}</ul></div>
      <p class="flag">Links will point at the pinned kernel release (still an open decision).</p>`;
  }
  if (c.refs){
    h += `<div><h3>Further reading</h3><ul class="src">${c.refs.map(([t,u]) => `<li><a href="${u}" target="_blank" rel="noopener">${esc(t)}</a></li>`).join('')}</ul></div>`;
  }
  if (OPENS[id] && OPENS[id] !== st.level) h += `<button type="button" class="primary" id="openSel">Open ${esc(c.name)} ›</button>`;
  else if (homeOf(id) !== st.level) h += `<button type="button" class="primary" id="goHome">Go to ${esc(VIEWS[homeOf(id)].title)} level</button>`;
  box.innerHTML = h;
  $('#openSel')?.addEventListener('click', () => { const b = st.boxes[id]?.[0]; navigate(OPENS[id], {origin:b}); });
  $('#goHome')?.addEventListener('click', () => navigate(homeOf(id)));
}

/* ---------- playback ---------- */
const steps = () => SCEN[st.scen];
function applyTrace(){
  scene.querySelectorAll('.active,.target,.flow,.rev').forEach(x => x.classList.remove('active','target','flow','rev'));
  scene.querySelectorAll('.link .dot').forEach(d => d.remove());
  const s = steps()[st.idx];
  if (!s || s.view !== st.level) return;
  scene.querySelectorAll(`.hot[data-id="${s.at}"]`).forEach(n => n.classList.add('active'));
  if (!s.to) return;
  scene.querySelectorAll(`.hot[data-id="${s.to}"]`).forEach(n => n.classList.add('target'));
  let link = scene.querySelector(`.link[data-key="${s.at}>${s.to}"]`), rev = false;
  if (!link){ link = scene.querySelector(`.link[data-key="${s.to}>${s.at}"]`); rev = true; }
  if (!link) return;
  link.classList.add('flow');
  if (rev) link.classList.add('rev');
  if (!reduced.matches){
    const dot = el('circle', {class:'dot', r:6}, link);
    el('animateMotion', {dur:'1.1s', repeatCount:'indefinite', path:link.dataset.d,
      ...(rev ? {keyPoints:'1;0', keyTimes:'0;1', calcMode:'linear'} : {})}, dot);
  }
}
function goStep(i){
  const list = steps();
  st.idx = Math.max(-1, Math.min(i, list.length-1));
  const s = list[st.idx];
  if (s){
    st.selected = s.at;
    if (s.view !== st.level) navigate(s.view);
    else { applySelection(); applyTrace(); renderInspector(); }
  } else applyTrace();
  renderPlayback();
}
function fmt(ns){
  if (ns < 1000) return ns.toLocaleString('en-US') + ' ns';
  if (ns < 1e6) return (ns/1000).toLocaleString('en-US',{maximumFractionDigits:1}) + ' µs';
  return (ns/1e6).toLocaleString('en-US',{maximumFractionDigits:2}) + ' ms';
}
function renderPlayback(){
  const list = steps(), s = list[st.idx];
  $('#stepno').textContent = s ? `Step ${st.idx+1} of ${list.length} · ${LAYER_NAME[C[s.at].layer]} · ${VIEWS[s.view].title} level` : `${list.length} steps · press play`;
  $('#steptext').textContent = s ? s.note : (st.scen === 'read'
    ? 'Follow one read() from a process through the kernel, out to the SSD and back.'
    : 'Follow one load instruction from a register through every cache level out to a DIMM.');
  const done = list.slice(0, st.idx+1);
  const known = done.filter(x => x.ns != null), sum = known.reduce((a,x) => a + x.ns, 0);
  const unk = done.length - known.length;
  $('#latBig').textContent = (known.length ? '≈ ' : '') + fmt(sum);
  $('#latSub').textContent = s ? `${known.length} placeholder figure${known.length===1?'':'s'} · ${unk} step${unk===1?'':'s'} unsourced` : 'cumulative latency';
  const pb = $('#playBtn');
  pb.textContent = st.playing ? '❚❚' : '▶';
  pb.setAttribute('aria-label', st.playing ? 'Pause' : 'Play');
  const wrap = $('#steps'); wrap.replaceChildren();
  list.forEach((x, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = C[x.at].layer + (i < st.idx ? ' done' : '') + (i === st.idx ? ' on' : '');
    b.title = `${i+1}. ${x.note}`;
    b.setAttribute('aria-label', `Step ${i+1}: ${x.note}`);
    b.onclick = () => { pause(); goStep(i); };
    wrap.append(b);
  });
}
function tick(){
  const list = steps();
  if (st.idx >= list.length-1){ pause(); return; }
  const crossing = list[st.idx+1].view !== st.level;
  goStep(st.idx+1);
  st.timer = setTimeout(tick, crossing ? 2300 : 1700);
}
function play(){
  if (st.idx >= steps().length-1) st.idx = -1;
  st.playing = true; renderPlayback(); tick();
}
function pause(){ st.playing = false; clearTimeout(st.timer); renderPlayback(); }

$('#playBtn').onclick = () => st.playing ? pause() : play();
$('#fwd').onclick = () => { pause(); goStep(st.idx+1); };
$('#back').onclick = () => { pause(); goStep(st.idx-1); };
$('#reset').onclick = () => { pause(); goStep(-1); };
$('#scenario').onchange = e => { pause(); st.scen = e.target.value; goStep(-1); };
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && VIEWS[st.level].parent){ navigate(VIEWS[st.level].parent); return; }
  if (e.target.closest('select,button,.hot')) return;
  if (e.key === 'ArrowRight'){ pause(); goStep(st.idx+1); }
  if (e.key === 'ArrowLeft'){ pause(); goStep(st.idx-1); }
});

// Deep link (FR4): #kernel, #cpu, #cpu.core
const start = (location.hash || '').slice(1);
if (VIEWS[start]){ st.level = start; st.selected = {kernel:'kernel.pagecache', cpu:'cpu.core', 'cpu.core':'cpu.core.l1d'}[start] || 'cpu'; }
draw(st.level); renderInspector(); renderPlayback();
</script>
</body></html>
